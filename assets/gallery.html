*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
main{max-width:1120px;margin:0 auto;padding:36px 28px 48px}header{display:flex;align-items:center;gap:18px;margin-bottom:25px}header img{width:76px;height:76px;object-fit:contain}h1{font-size:27px;font-weight:650;letter-spacing:.04em;margin:0}header p{color:var(--muted);margin:3px 0 0}.search{display:flex;gap:12px;align-items:center;margin-bottom:22px}.search input{width:100%;min-width:0;border:1px solid var(--line);border-radius:13px;padding:12px 16px;background:var(--surface);color:var(--ink)}#count{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:28px;align-items:start}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.sticker{border:1px solid transparent;background:transparent;border-radius:16px;padding:9px 3px 10px;color:var(--ink);transition:background .15s,border-color .15s}.sticker:hover{background:var(--surface)}.sticker[aria-pressed=true]{background:var(--surface);border-color:var(--accent);box-shadow:var(--shadow)}.sticker img{width:100%;aspect-ratio:1;object-fit:contain;display:block}.sticker span{display:block;font-size:13px;text-align:center}aside{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:19px;box-shadow:var(--shadow)}#preview{display:block;width:100%;aspect-ratio:1;object-fit:contain}h2{font-size:19px;text-align:center;margin:9px 0 2px}#number{color:var(--muted);text-align:center;margin:0 0 17px}.actions{display:grid;gap:9px}.action{display:block;text-align:center;border:1px solid var(--line);border-radius:11px;padding:9px 10px;color:var(--ink);background:var(--paper);text-decoration:none}.action.primary{background:var(--soft);border-color:transparent}#status{font-size:13px;color:var(--muted);min-height:22px;margin:12px 0 0;text-align:center}#copy-fallback{width:100%;min-height:100px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);margin-top:10px}#empty{padding:35px 10px;color:var(--muted);text-align:center}footer{color:var(--muted);font-size:12px;margin-top:25px;text-align:center}[hidden]{display:none!important}
@media(max-width:800px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.layout{grid-template-columns:minmax(0,1fr) 230px;gap:18px}}

<script>
(() => {
  const items = JSON.parse(document.getElementById('catalog').textContent).stickers;
  const byId = id => document.getElementById(id);
  const grid = byId('grid');
  let selected = items[0];
  function select(item) {
    selected = item;
    byId('preview').src = item.file;
    byId('preview').alt = item.label;
    byId('title').textContent = item.label;
    byId('number').textContent = `${String(item.number).padStart(2,'0')} / 30`;
    byId('download').href = item.file;
    byId('download').download = item.file.split('/').pop();
    byId('status').textContent = '';
    byId('copy-fallback').hidden = true;
    grid.querySelectorAll('button').forEach(button => button.setAttribute('aria-pressed', String(Number(button.dataset.number) === item.number)));
  }
  function render() {
    const query = byId('search').value.trim().toLowerCase();
    const visible = items.filter(item => !query || [item.id,item.label,String(item.number),String(item.number).padStart(2,'0'),...item.keywords].some(word => word.toLowerCase().includes(query)));
    grid.replaceChildren();
    for (const item of visible) {
      const button = document.createElement('button');
      button.type = 'button'; button.className = 'sticker'; button.dataset.number = item.number;
      button.setAttribute('aria-label', `${String(item.number).padStart(2,'0')} ${item.label}`);
      button.setAttribute('aria-pressed', String(item.number === selected.number));
      const img = document.createElement('img'); img.src = item.file; img.alt = ''; img.loading = 'lazy';
      const title = document.createElement('span'); title.textContent = item.label;
      button.append(img,title); button.addEventListener('click',() => select(item)); grid.append(button);
    }
    byId('count').textContent = `${visible.length} 张`;
    byId('empty').hidden = visible.length > 0;
  }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); byId('status').textContent = '已复制，可以粘贴到聊天里。'; byId('copy-fallback').hidden = true; }
    catch { const field = byId('copy-fallback'); field.hidden = false; field.value = text; field.focus(); field.select(); byId('status').textContent = '已选中内容，请按 Ctrl+C 或长按复制。'; }
  }
  byId('copy').addEventListener('click', () => {
    const url = new URL(selected.file,location.href);
    const path = url.protocol === 'file:' ? decodeURIComponent(url.pathname).replace(/^\/([A-Za-z]:\/)/,'$1') : url.href;
    copy(`![Codex龙娘·${selected.label}](${path})`);
  });
  byId('ask').addEventListener('click', () => copy(`用 $codex-dragon-stickers 发一个「${selected.label}」表情。`));
  byId('search').addEventListener('input',render);
  render();
})();
</script>
